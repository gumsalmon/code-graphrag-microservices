services:
  neo4j:
    image: neo4j:5.26.0
    container_name: petclinic-code-graphrag-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser Web UI
      - "7687:7687" # Bolt protocol for Python neo4j driver
    environment:
      - NEO4J_AUTH=neo4j/graphrag2026
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
      - ./neo4j_import:/var/lib/neo4j/import
      - ./output:/output
